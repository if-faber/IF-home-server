name: Strona startowa — obraz (ghcr.io)

# Buduje obraz strony startowej IF-startpage z folderu strona/ i wysyła go do
# ghcr.io/if-faber/if-startpage. Uruchamia się przy wydaniu:
#   vX.Y.Z         — wspólne wydanie serwera i strony (np. v0.3.0)
#   strona-vX.Y.Z  — sama poprawka strony (np. strona-v0.3.1); if-server tych tagów nie widzi
# Numer obrazu = numer wersji bez „strona-” (np. v0.3.1).
# Autoryzacja przez wbudowany GITHUB_TOKEN — bez sekretów w ustawieniach repozytorium.

on:
  push:
    tags:
      - "v*.*.*"
      - "strona-v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    # Konkretna wersja systemu zamiast ubuntu-latest — zmiana systemu tylko świadomie.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ustal numer wersji
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            echo "tag=${tag#strona-}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=manual-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Zaloguj do ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ustaw Buildx
        uses: docker/setup-buildx-action@v4

      - name: Zbuduj i wypchnij obraz
        uses: docker/build-push-action@v7
        with:
          context: ./strona
          push: true
          tags: |
            ghcr.io/if-faber/if-startpage:${{ steps.version.outputs.tag }}
            ghcr.io/if-faber/if-startpage:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
