# Sprawdza wszystkie skrypty .sh ShellCheckiem przy każdym pushu i pull requeście.
# Błąd = czerwony znaczek przy commicie na GitHubie. Uwagi informacyjne (note) nie blokują.
name: ShellCheck

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --version
          find . -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 -r shellcheck --severity=warning
